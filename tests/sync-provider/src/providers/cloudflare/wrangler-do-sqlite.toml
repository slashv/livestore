name = "livestore-integration-test-do"
compatibility_date = "2024-12-01"
compatibility_flags = [
  "enable_request_signal", # Needed for HTTP RPC streams
]
main = "./test-worker.ts"

[[durable_objects.bindings]]
name = "SYNC_BACKEND_DO"
class_name = "SyncBackendDO"

[[durable_objects.bindings]]
name = "TEST_CLIENT_DO"
class_name = "TestClientDo"

[[durable_objects.bindings]]
name = "STORE_CLIENT_DO"
class_name = "StoreClientDo"

# Experimental snapshot boot: a sync DO that wakes checkpointers, and the checkpointer DOs
[[durable_objects.bindings]]
name = "SNAPSHOT_SYNC_BACKEND_DO"
class_name = "SnapshotSyncBackendDO"

[[durable_objects.bindings]]
name = "CHECKPOINTER_DO"
class_name = "CheckpointerDO"

[[durable_objects.bindings]]
name = "MEASURE_CHECKPOINTER_DO"
class_name = "MeasureCheckpointerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncBackendDO", "TestClientDo", "StoreClientDo"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SnapshotSyncBackendDO", "CheckpointerDO", "MeasureCheckpointerDO"]

# Snapshot blobs (experimental snapshot boot); simulated locally by miniflare
[[r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "livestore-test-snapshots"
